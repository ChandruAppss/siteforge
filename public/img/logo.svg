<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 374 74" width="374" height="74" role="img"
  aria-label="SiteForge">
  <defs>
    <linearGradient id="sfg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#814bf5" />
      <stop offset="1" stop-color="#550cca" />
    </linearGradient>
  </defs>

  <!-- mark: a stylised anvil / forge block made of stacked page bars -->
  <rect x="4" y="9" width="56" height="56" rx="16" fill="url(#sfg)" />
  <rect x="16" y="23" width="32" height="7" rx="3.5" fill="#fff" />
  <rect x="16" y="34" width="22" height="7" rx="3.5" fill="#fff" opacity=".82" />
  <rect x="16" y="45" width="28" height="7" rx="3.5" fill="#fff" opacity=".64" />

  <!-- wordmark -->
  <text x="74" y="49" font-family="'Source Sans 3', system-ui, sans-serif" font-size="38" font-weight="800"
    letter-spacing="-1" fill="#15083f">Site<tspan fill="#6a2bf3">Forge</tspan></text>
</svg>
